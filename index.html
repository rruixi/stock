<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货交易模拟游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/bignumber.js@9.1.2/bignumber.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        /* ==================== 布局结构 ==================== */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        /* 顶部资产面板 */
        .asset-panel {
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            padding: 16px 20px;
            border-bottom: 1px solid #2a3f5f;
            min-height: 120px;
            flex-shrink: 0;
        }

        .asset-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 12px;
        }

        .asset-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #1f88d9;
            font-size: 13px;
        }

        .asset-item label {
            display: block;
            color: #999;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .asset-item .value {
            font-size: 18px;
            font-weight: bold;
            color: #e0e0e0;
            word-break: break-all;
        }

        .asset-item.profit .value {
            color: #00ff41;
        }

        .asset-item.loss .value {
            color: #ff3333;
        }

        /* K线图表区域 */
        .chart-container {
            flex: 1;
            background: #0a0e27;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chart-header {
            background: #141829;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3f5f;
            font-size: 13px;
        }

        .chart-title {
            font-weight: bold;
            color: #e0e0e0;
            font-size: 16px;
        }

        .chart-price {
            color: #00ff41;
            font-weight: bold;
            font-size: 18px;
            margin-left: 16px;
            word-break: break-all;
        }

        .kline-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .kline-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a3f5f;
            color: #999;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .kline-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .kline-btn.active {
            background: #1f88d9;
            color: #fff;
            border-color: #1f88d9;
        }

        .chart-controls {
            background: #141829;
            padding: 8px 20px;
            border-bottom: 1px solid #2a3f5f;
            display: flex;
            gap: 16px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .chart-control-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-control-item label {
            color: #999;
        }

        .chart-control-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        canvas#klineChart {
            flex: 1;
            width: 100%;
            display: block;
            background: #0a0e27;
        }

        canvas#volumeChart {
            width: 100%;
            height: 80px;
            display: block;
            background: #0a0e27;
            border-top: 1px solid #2a3f5f;
        }

        canvas#macdChart {
            width: 100%;
            height: 80px;
            display: block;
            background: #0a0e27;
            border-top: 1px solid #2a3f5f;
        }

        /* 主要内容区域 */
        .main-content {
            display: flex;
            flex: 1;
            gap: 0;
            min-height: 0;
        }

        /* 交易面板 */
        .trading-panel {
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            padding: 20px;
            border-right: 1px solid #2a3f5f;
            width: 320px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 品种选择 */
        .commodity-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .commodity-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #2a3f5f;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .commodity-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #1f88d9;
        }

        .commodity-btn.active {
            background: #1f88d9;
            border-color: #1f88d9;
            color: #fff;
        }

        /* 杠杆控制 */
        .leverage-control {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .leverage-btn {
            flex: 1;
            min-width: 50px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2a3f5f;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .leverage-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .leverage-btn.active {
            background: #ff6b35;
            border-color: #ff6b35;
            color: #fff;
        }

        /* 手数输入 */
        .quantity-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .qty-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2a3f5f;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .qty-btn.full {
            background: rgba(0, 255, 65, 0.2);
            border-color: rgba(0, 255, 65, 0.5);
        }

        .qty-btn.half {
            background: rgba(31, 136, 217, 0.2);
            border-color: rgba(31, 136, 217, 0.5);
        }

        .quantity-input {
            grid-column: 1 / -1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a3f5f;
            color: #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .quantity-input::placeholder {
            color: #555;
        }

        .quantity-input:focus {
            outline: none;
            border-color: #1f88d9;
            background: rgba(31, 136, 217, 0.1);
        }

        /* 买卖按钮 */
        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .buy-btn, .sell-btn {
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }

        .buy-btn {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.3);
        }

        .buy-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 255, 65, 0.4);
            transform: translateY(-2px);
        }

        .buy-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 255, 65, 0.2);
        }

        .sell-btn {
            background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%);
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
        }

        .sell-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.4);
            transform: translateY(-2px);
        }

        .sell-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(255, 51, 51, 0.2);
        }

        /* 持仓列表 */
        .position-list {
            background: #141829;
            padding: 20px;
            width: 350px;
            overflow-y: auto;
            border-left: 1px solid #2a3f5f;
            flex-shrink: 0;
        }

        .position-list-title {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .position-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #1f88d9;
            font-size: 13px;
        }

        .position-item.long {
            border-left-color: #00ff41;
        }

        .position-item.short {
            border-left-color: #ff3333;
        }

        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .position-type {
            font-weight: bold;
            color: #e0e0e0;
        }

        .position-pl {
            font-weight: bold;
            font-size: 14px;
            word-break: break-all;
        }

        .position-pl.profit {
            color: #00ff41;
        }

        .position-pl.loss {
            color: #ff3333;
        }

        .position-detail {
            color: #999;
            font-size: 12px;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .close-btn {
            width: 100%;
            padding: 8px;
            background: rgba(255, 51, 51, 0.2);
            border: 1px solid #ff3333;
            color: #ff3333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 51, 51, 0.3);
        }

        .close-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 20px;
            font-size: 13px;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1f3a;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        .modal-message {
            font-size: 15px;
            color: #999;
            margin-bottom: 20px;
            line-height: 1.6;
            word-break: break-all;
        }

        .modal-btn {
            padding: 12px 30px;
            background: #1f88d9;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: #1570b8;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        /* 图例 */
        .chart-legend {
            background: #141829;
            padding: 8px 20px;
            border-bottom: 1px solid #2a3f5f;
            display: flex;
            gap: 20px;
            font-size: 11px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 资产面板 -->
        <div class="asset-panel">
            <div class="asset-row">
                <div class="asset-item">
                    <label>账户余额</label>
                    <div class="value" id="balance">¥100,000.00</div>
                </div>
                <div class="asset-item">
                    <label>账户净值</label>
                    <div class="value" id="equity">¥100,000.00</div>
                </div>
                <div class="asset-item" id="floatingPLDisplay">
                    <label>浮动盈亏</label>
                    <div class="value" id="floatingPL">¥0.00</div>
                </div>
                <div class="asset-item">
                    <label>已用保证金 / 可用</label>
                    <div class="value" id="margin">¥0 / ¥100,000</div>
                </div>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="main-content">
            <!-- K线图表 -->
            <div class="chart-container" style="flex: 1;">
                <div class="chart-header">
                    <div>
                        <span class="chart-title" id="commodityName">黄金 (GOLD)</span>
                        <span class="chart-price" id="currentPrice">1850.00</span>
                    </div>
                    <div class="kline-buttons">
                        <button class="kline-btn active" data-period="1s">1s</button>
                        <button class="kline-btn" data-period="5s">5s</button>
                        <button class="kline-btn" data-period="15s">15s</button>
                        <button class="kline-btn" data-period="30s">30s</button>
                        <button class="kline-btn" data-period="1m">1m</button>
                    </div>
                </div>

                <!-- 图表控制 -->
                <div class="chart-controls">
                    <div class="chart-control-item">
                        <input type="checkbox" id="showMA" checked>
                        <label for="showMA">均线</label>
                    </div>
                    <div class="chart-control-item">
                        <input type="checkbox" id="showBoll" checked>
                        <label for="showBoll">布林线</label>
                    </div>
                    <div class="chart-control-item">
                        <input type="checkbox" id="showVolume" checked>
                        <label for="showVolume">成交量</label>
                    </div>
                    <div class="chart-control-item">
                        <input type="checkbox" id="showMACD" checked>
                        <label for="showMACD">MACD</label>
                    </div>
                </div>

                <!-- 图例 -->
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff9800;"></div>
                        <span>MA5</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2196f3;"></div>
                        <span>MA10</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4caf50;"></div>
                        <span>MA20</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgba(255, 255, 255, 0.2);"></div>
                        <span>布林线</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #00ff41;"></div>
                        <span>MACD</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff3333;"></div>
                        <span>Signal</span>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="chart-wrapper">
                    <canvas id="klineChart"></canvas>
                    <canvas id="volumeChart"></canvas>
                    <canvas id="macdChart"></canvas>
                </div>
            </div>

            <!-- 交易面板 -->
            <div class="trading-panel">
                <div class="panel-section">
                    <div class="section-title">交易品种</div>
                    <div class="commodity-selector">
                        <button class="commodity-btn active" data-commodity="gold">黄金</button>
                        <button class="commodity-btn" data-commodity="silver">白银</button>
                        <button class="commodity-btn" data-commodity="oil">原油</button>
                        <button class="commodity-btn" data-commodity="soybean">豆粕</button>
                    </div>
                </div>

                <div class="panel-section">
                    <div class="section-title">杠杆倍数</div>
                    <div class="leverage-control">
                        <button class="leverage-btn active" data-leverage="1">1x</button>
                        <button class="leverage-btn" data-leverage="10">10x</button>
                        <button class="leverage-btn" data-leverage="20">20x</button>
                        <button class="leverage-btn" data-leverage="50">50x</button>
                        <button class="leverage-btn" data-leverage="100">100x</button>
                    </div>
                </div>

                <div class="panel-section">
                    <div class="section-title">持仓手数</div>
                    <div class="quantity-input-group">
                        <button class="qty-btn full" id="fullBtn">全仓</button>
                        <button class="qty-btn half" id="halfBtn">半仓</button>
                        <button class="qty-btn" id="clearQtyBtn">清空</button>
                    </div>
                    <input type="number" class="quantity-input" id="quantityInput" placeholder="输入手数" min="1" value="1">
                </div>

                <div class="trade-buttons">
                    <button class="buy-btn" id="buyBtn">做多 ↑</button>
                    <button class="sell-btn" id="sellBtn">做空 ↓</button>
                </div>
            </div>

            <!-- 持仓列表 -->
            <div class="position-list" id="positionListContainer">
                <div class="position-list-title">持仓列表</div>
                <div id="positionList">
                    <div class="empty-state">暂无持仓</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-message" id="modalMessage">消息</div>
            <button class="modal-btn" id="modalBtn">确定</button>
        </div>
    </div>

    <script>
        // ==================== BigNumber 配置 ====================
        BigNumber.config({
            DECIMAL_PLACES: 150,
            ROUNDING_MODE: BigNumber.ROUND_DOWN,
            EXPONENTIAL_AT: [-150, 150],
            FORMAT: {
                decimalSeparator: '.',
                groupSeparator: ',',
                groupSize: 3
            }
        });

        // ==================== 高精度数学工具 ====================
        const BigMath = {
            // 创建BigNumber
            create: (value) => new BigNumber(value),
            
            // 加法
            add: (a, b) => new BigNumber(a).plus(new BigNumber(b)),
            
            // 减法
            subtract: (a, b) => new BigNumber(a).minus(new BigNumber(b)),
            
            // 乘法
            multiply: (a, b) => new BigNumber(a).times(new BigNumber(b)),
            
            // 除法
            divide: (a, b) => new BigNumber(a).dividedBy(new BigNumber(b)),
            
            // 平方根
            sqrt: (a) => new BigNumber(a).sqrt(),
            
            // 幂运算
            pow: (a, b) => new BigNumber(a).pow(new BigNumber(b)),
            
            // 绝对值
            abs: (a) => new BigNumber(a).abs(),
            
            // 比较
            isGreaterThan: (a, b) => new BigNumber(a).isGreaterThan(new BigNumber(b)),
            isLessThan: (a, b) => new BigNumber(a).isLessThan(new BigNumber(b)),
            isEqualTo: (a, b) => new BigNumber(a).isEqualTo(new BigNumber(b)),
            
            // 最大值
            max: (...values) => BigNumber.max(...values.map(v => new BigNumber(v))),
            
            // 最小值
            min: (...values) => BigNumber.min(...values.map(v => new BigNumber(v))),
            
            // 转换为字符串（不使用科学计数法）
            toString: (value, decimals = 150) => {
                const bn = new BigNumber(value);
                return bn.toFixed(decimals, BigNumber.ROUND_DOWN);
            },
            
            // 转换为显示格式（保留指定小数位）
            toDisplay: (value, decimals = 2) => {
                const bn = new BigNumber(value);
                return bn.toFixed(decimals, BigNumber.ROUND_DOWN);
            },
            
            // 转换为数字（用于绘图）
            toNumber: (value) => new BigNumber(value).toNumber()
        };

        // ==================== 全局配置 ====================
        const CONFIG = {
            initialBalance: BigMath.create('100000'),
            marginRatio: BigMath.create('0.05'),
            liquidationThreshold: BigMath.create('0.2'),
            commodities: {
                gold: { 
                    name: '黄金', 
                    symbol: 'GOLD', 
                    initialPrice: BigMath.create('1850'), 
                    volatility: BigMath.create('0.003'), 
                    trend: BigMath.create('0.0002') 
                },
                silver: { 
                    name: '白银', 
                    symbol: 'SILVER', 
                    initialPrice: BigMath.create('22.5'), 
                    volatility: BigMath.create('0.01'), 
                    trend: BigMath.create('0.0005') 
                },
                oil: { 
                    name: '原油', 
                    symbol: 'OIL', 
                    initialPrice: BigMath.create('75'), 
                    volatility: BigMath.create('0.012'), 
                    trend: BigMath.create('0.0003') 
                },
                soybean: { 
                    name: '豆粕', 
                    symbol: 'SOYBEAN', 
                    initialPrice: BigMath.create('3800'), 
                    volatility: BigMath.create('0.008'), 
                    trend: BigMath.create('0.0001') 
                }
            },
            tickSize: BigMath.create('0.25')
        };

        // ==================== 游戏状态 ====================
        const gameState = {
            balance: BigMath.create(CONFIG.initialBalance),
            positions: [],
            currentCommodity: 'gold',
            currentLeverage: 1,
            currentQuantity: 1,
            prices: {},
            klineData: {},
            marketData: {},
            chartSettings: {
                showMA: true,
                showBoll: true,
                showVolume: true,
                showMACD: true
            }
        };

        // 初始化价格数据
        Object.keys(CONFIG.commodities).forEach(key => {
            gameState.prices[key] = [BigMath.create(CONFIG.commodities[key].initialPrice)];
            gameState.klineData[key] = {
                '1s': [],
                '5s': [],
                '15s': [],
                '30s': [],
                '1m': []
            };
            gameState.marketData[key] = {
                currentPrice: BigMath.create(CONFIG.commodities[key].initialPrice),
                trend: BigMath.create('0'),
                lastUpdateTime: Date.now()
            };
        });

        // ==================== 高精度随机数生成 ====================
        function randomBigNumber() {
            // 生成0-1之间的高精度随机数
            let randomStr = '0.';
            for (let i = 0; i < 150; i++) {
                randomStr += Math.floor(Math.random() * 10);
            }
            return BigMath.create(randomStr);
        }

        // Box-Muller变换生成正态分布随机数
        function normalRandom() {
            const u1 = randomBigNumber();
            const u2 = randomBigNumber();
            
            // z = sqrt(-2 * ln(u1)) * cos(2 * PI * u2)
            const minusTwo = BigMath.create('-2');
            const ln_u1 = BigMath.create(Math.log(BigMath.toNumber(u1)));
            const sqrt_part = BigMath.sqrt(BigMath.multiply(minusTwo, ln_u1));
            
            const twoPi = BigMath.create(2 * Math.PI);
            const angle = BigMath.multiply(twoPi, u2);
            const cos_part = BigMath.create(Math.cos(BigMath.toNumber(angle)));
            
            return BigMath.multiply(sqrt_part, cos_part);
        }

        // ==================== 价格生成引擎 ====================
        function generateNextPrice(commodity) {
            const config = CONFIG.commodities[commodity];
            const currentPrice = gameState.marketData[commodity].currentPrice;
            
            const priceHistory = gameState.prices[commodity];
            let trend = config.trend;
            
            if (priceHistory.length > 20) {
                const recentPrices = priceHistory.slice(-20);
                let sum = BigMath.create('0');
                recentPrices.forEach(p => {
                    sum = BigMath.add(sum, p);
                });
                const avgPrice = BigMath.divide(sum, BigMath.create('20'));
                
                const firstPrice = recentPrices[0];
                const lastPrice = recentPrices[recentPrices.length - 1];
                const priceDiff = BigMath.subtract(lastPrice, firstPrice);
                const denominator = BigMath.multiply(BigMath.create('20'), avgPrice);
                const trendCalc = BigMath.divide(priceDiff, denominator);
                trend = BigMath.multiply(trendCalc, BigMath.create('0.1'));
            }

            const z = normalRandom();
            
            const dt = CONFIG.tickSize;
            const driftTerm = BigMath.multiply(
                BigMath.multiply(trend, currentPrice),
                dt
            );
            
            const sqrtDt = BigMath.sqrt(dt);
            const volatilityTerm = BigMath.multiply(
                BigMath.multiply(
                    BigMath.multiply(config.volatility, currentPrice),
                    z
                ),
                sqrtDt
            );
            
            const newPrice = BigMath.add(
                BigMath.add(currentPrice, driftTerm),
                volatilityTerm
            );

            const minPrice = BigMath.multiply(currentPrice, BigMath.create('0.5'));
            return BigMath.isGreaterThan(newPrice, minPrice) ? newPrice : minPrice;
        }

        function updatePrices() {
            const now = Date.now();

            Object.keys(CONFIG.commodities).forEach(commodity => {
                const newPrice = generateNextPrice(commodity);
                gameState.marketData[commodity].currentPrice = newPrice;
                gameState.prices[commodity].push(newPrice);
                
                // 保留最近1000个价格点
                if (gameState.prices[commodity].length > 1000) {
                    gameState.prices[commodity].shift();
                }
                
                updateKlineData(commodity, newPrice, now);
            });

            if (gameState.currentCommodity) {
                updateUI();
            }
        }

        function updateKlineData(commodity, price, timestamp) {
            const klineTypes = ['1s', '5s', '15s', '30s', '1m'];
            const intervals = {
                '1s': 1000,
                '5s': 5000,
                '15s': 15000,
                '30s': 30000,
                '1m': 60000
            };

            klineTypes.forEach(period => {
                const klines = gameState.klineData[commodity][period];
                const interval = intervals[period];

                if (klines.length === 0) {
                    klines.push({
                        time: timestamp,
                        open: BigMath.create(price),
                        close: BigMath.create(price),
                        high: BigMath.create(price),
                        low: BigMath.create(price),
                        volume: 1
                    });
                } else {
                    const lastKline = klines[klines.length - 1];
                    
                    if (timestamp - lastKline.time >= interval) {
                        klines.push({
                            time: timestamp,
                            open: BigMath.create(price),
                            close: BigMath.create(price),
                            high: BigMath.create(price),
                            low: BigMath.create(price),
                            volume: 1
                        });
                    } else {
                        lastKline.close = BigMath.create(price);
                        lastKline.high = BigMath.max(lastKline.high, price);
                        lastKline.low = BigMath.min(lastKline.low, price);
                        lastKline.volume++;
                    }
                }

                if (klines.length > 200) {
                    klines.shift();
                }
            });
        }

        // ==================== 技术指标计算 ====================
        function calculateMA(klines, period) {
            const result = [];
            for (let i = 0; i < klines.length; i++) {
                const start = Math.max(0, i - period + 1);
                const slice = klines.slice(start, i + 1);
                
                let sum = BigMath.create('0');
                slice.forEach(k => {
                    const avg = BigMath.divide(
                        BigMath.add(
                            BigMath.add(
                                BigMath.add(k.open, k.close),
                                k.high
                            ),
                            k.low
                        ),
                        BigMath.create('4')
                    );
                    sum = BigMath.add(sum, avg);
                });
                
                const ma = BigMath.divide(sum, BigMath.create(slice.length.toString()));
                result.push(ma);
            }
            return result;
        }

        function calculateBollinger(klines, period = 20, stdDev = 2) {
            const result = {
                middle: [],
                upper: [],
                lower: []
            };

            for (let i = 0; i < klines.length; i++) {
                const start = Math.max(0, i - period + 1);
                const slice = klines.slice(start, i + 1);
                
                const values = [];
                let sum = BigMath.create('0');
                
                slice.forEach(k => {
                    const avg = BigMath.divide(
                        BigMath.add(
                            BigMath.add(
                                BigMath.add(k.open, k.close),
                                k.high
                            ),
                            k.low
                        ),
                        BigMath.create('4')
                    );
                    values.push(avg);
                    sum = BigMath.add(sum, avg);
                });
                
                const mean = BigMath.divide(sum, BigMath.create(values.length.toString()));
                
                let varianceSum = BigMath.create('0');
                values.forEach(val => {
                    const diff = BigMath.subtract(val, mean);
                    varianceSum = BigMath.add(varianceSum, BigMath.multiply(diff, diff));
                });
                
                const variance = BigMath.divide(varianceSum, BigMath.create(values.length.toString()));
                const std = BigMath.sqrt(variance);
                
                const stdDevBig = BigMath.create(stdDev.toString());
                const upperBand = BigMath.add(mean, BigMath.multiply(stdDevBig, std));
                const lowerBand = BigMath.subtract(mean, BigMath.multiply(stdDevBig, std));

                result.middle.push(mean);
                result.upper.push(upperBand);
                result.lower.push(lowerBand);
            }

            return result;
        }

        function calculateMACD(klines) {
            const prices = klines.map(k => 
                BigMath.divide(
                    BigMath.add(
                        BigMath.add(
                            BigMath.add(k.open, k.close),
                            k.high
                        ),
                        k.low
                    ),
                    BigMath.create('4')
                )
            );
            
            const ema12 = calculateEMA(prices, 12);
            const ema26 = calculateEMA(prices, 26);
            
            const macdLine = [];
            for (let i = 0; i < ema12.length; i++) {
                macdLine.push(BigMath.subtract(ema12[i], ema26[i]));
            }
            
            const signalLine = calculateEMA(macdLine, 9);
            
            const histogram = [];
            for (let i = 0; i < macdLine.length; i++) {
                const signal = signalLine[i] || BigMath.create('0');
                histogram.push(BigMath.subtract(macdLine[i], signal));
            }
            
            return {
                macd: macdLine,
                signal: signalLine,
                histogram: histogram
            };
        }

        function calculateEMA(prices, period) {
            const result = [];
            const multiplier = BigMath.divide(
                BigMath.create('2'),
                BigMath.add(BigMath.create(period.toString()), BigMath.create('1'))
            );
            
            let sum = BigMath.create('0');
            for (let i = 0; i < Math.min(period, prices.length); i++) {
                sum = BigMath.add(sum, prices[i]);
            }
            let ema = BigMath.divide(sum, BigMath.create(Math.min(period, prices.length).toString()));
            result.push(ema);
            
            for (let i = period; i < prices.length; i++) {
                const diff = BigMath.subtract(prices[i], ema);
                ema = BigMath.add(BigMath.multiply(diff, multiplier), ema);
                result.push(ema);
            }
            
            return result;
        }

        // ==================== 交易逻辑 ====================
        function calculateMarginRequired(commodity, quantity) {
            const price = gameState.marketData[commodity].currentPrice;
            const contractValue = BigMath.multiply(
                BigMath.multiply(price, BigMath.create(quantity.toString())),
                BigMath.create('100')
            );
            return BigMath.multiply(contractValue, CONFIG.marginRatio);
        }

        function calculateMarginRate() {
            let usedMargin = BigMath.create('0');
            gameState.positions.forEach(pos => {
                usedMargin = BigMath.add(usedMargin, calculateMarginRequired(pos.commodity, pos.quantity));
            });

            const availableBalance = gameState.balance;
            if (BigMath.isEqualTo(usedMargin, BigMath.create('0'))) {
                return BigMath.create('999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999');
            }
            return BigMath.divide(availableBalance, usedMargin);
        }

        function openPosition(type) {
            const commodity = gameState.currentCommodity;
            const quantity = parseInt(gameState.currentQuantity);
            const leverage = gameState.currentLeverage;

            if (quantity <= 0) {
                showModal('错误', '请输入有效的手数');
                return;
            }

            const marginRequired = BigMath.divide(
                calculateMarginRequired(commodity, quantity),
                BigMath.create(leverage.toString())
            );

            if (BigMath.isGreaterThan(marginRequired, gameState.balance)) {
                showModal('错误', 
                    `保证金不足。\n需要: ¥${BigMath.toDisplay(marginRequired, 150)}\n可用: ¥${BigMath.toDisplay(gameState.balance, 150)}`
                );
                return;
            }

            gameState.balance = BigMath.subtract(gameState.balance, marginRequired);

            const position = {
                id: Date.now(),
                commodity,
                type,
                quantity,
                leverage,
                entryPrice: BigMath.create(gameState.marketData[commodity].currentPrice),
                margin: marginRequired,
                openTime: new Date().toLocaleTimeString()
            };

            gameState.positions.push(position);
            showModal('成功', 
                `${type === 'long' ? '做多' : '做空'} ${quantity}手 ${CONFIG.commodities[commodity].name}\n` +
                `入场价格: ¥${BigMath.toDisplay(position.entryPrice, 150)}`
            );
            updateUI();
        }

        function closePosition(positionId) {
            const positionIndex = gameState.positions.findIndex(p => p.id === positionId);
            if (positionIndex === -1) return;

            const position = gameState.positions[positionIndex];
            const currentPrice = gameState.marketData[position.commodity].currentPrice;
            
            let profitLoss;
            const priceDiff = position.type === 'long' 
                ? BigMath.subtract(currentPrice, position.entryPrice)
                : BigMath.subtract(position.entryPrice, currentPrice);
            
            profitLoss = BigMath.multiply(
                BigMath.multiply(
                    BigMath.multiply(priceDiff, BigMath.create(position.quantity.toString())),
                    BigMath.create('100')
                ),
                BigMath.create(position.leverage.toString())
            );

            gameState.balance = BigMath.add(
                BigMath.add(gameState.balance, position.margin),
                profitLoss
            );

            gameState.positions.splice(positionIndex, 1);
            showModal('平仓', 
                `盈亏: ¥${BigMath.toDisplay(profitLoss, 150)}\n` +
                `入场价: ¥${BigMath.toDisplay(position.entryPrice, 150)}\n` +
                `平仓价: ¥${BigMath.toDisplay(currentPrice, 150)}`
            );
            updateUI();
        }

        function checkLiquidation() {
            const marginRate = calculateMarginRate();
            
            if (BigMath.isLessThan(marginRate, CONFIG.liquidationThreshold)) {
                let totalLoss = BigMath.create('0');
                gameState.positions.forEach(position => {
                    const currentPrice = gameState.marketData[position.commodity].currentPrice;
                    
                    const priceDiff = position.type === 'long' 
                        ? BigMath.subtract(currentPrice, position.entryPrice)
                        : BigMath.subtract(position.entryPrice, currentPrice);
                    
                    const profitLoss = BigMath.multiply(
                        BigMath.multiply(
                            BigMath.multiply(priceDiff, BigMath.create(position.quantity.toString())),
                            BigMath.create('100')
                        ),
                        BigMath.create(position.leverage.toString())
                    );
                    
                    totalLoss = BigMath.add(totalLoss, profitLoss);
                    gameState.balance = BigMath.add(gameState.balance, position.margin);
                });

                gameState.positions = [];
                showModal('爆仓', 
                    `保证金不足，已强制平仓！\n` +
                    `总损失: ¥${BigMath.toDisplay(totalLoss, 150)}\n` +
                    `剩余资金: ¥${BigMath.toDisplay(gameState.balance, 150)}`
                );
                updateUI();
            }
        }

        // ==================== UI 更新 ====================
        function updateUI() {
            const floatingPL = calculateFloatingPL();
            const equity = BigMath.add(gameState.balance, floatingPL);
            let usedMargin = BigMath.create('0');

            gameState.positions.forEach(pos => {
                usedMargin = BigMath.add(usedMargin, calculateMarginRequired(pos.commodity, pos.quantity));
            });

            document.getElementById('balance').textContent = `¥${BigMath.toDisplay(gameState.balance, 2)}`;
            document.getElementById('equity').textContent = `¥${BigMath.toDisplay(equity, 2)}`;
            
            const floatingPLDisplay = document.getElementById('floatingPLDisplay');
            const floatingPLElement = document.getElementById('floatingPL');
            floatingPLElement.textContent = `¥${BigMath.toDisplay(floatingPL, 2)}`;
            
            if (BigMath.isGreaterThan(floatingPL, BigMath.create('0')) || BigMath.isEqualTo(floatingPL, BigMath.create('0'))) {
                floatingPLDisplay.classList.add('profit');
                floatingPLDisplay.classList.remove('loss');
            } else {
                floatingPLDisplay.classList.add('loss');
                floatingPLDisplay.classList.remove('profit');
            }

            document.getElementById('margin').textContent = 
                `¥${BigMath.toDisplay(usedMargin, 0)} / ¥${BigMath.toDisplay(gameState.balance, 0)}`;

            const price = gameState.marketData[gameState.currentCommodity].currentPrice;
            document.getElementById('currentPrice').textContent = BigMath.toDisplay(price, 2);

            updatePositionList();
            drawCharts();
        }

        function calculateFloatingPL() {
            let totalPL = BigMath.create('0');
            gameState.positions.forEach(position => {
                const currentPrice = gameState.marketData[position.commodity].currentPrice;
                
                const priceDiff = position.type === 'long' 
                    ? BigMath.subtract(currentPrice, position.entryPrice)
                    : BigMath.subtract(position.entryPrice, currentPrice);
                
                const pl = BigMath.multiply(
                    BigMath.multiply(
                        BigMath.multiply(priceDiff, BigMath.create(position.quantity.toString())),
                        BigMath.create('100')
                    ),
                    BigMath.create(position.leverage.toString())
                );
                
                totalPL = BigMath.add(totalPL, pl);
            });
            return totalPL;
        }

        function updatePositionList() {
            const list = document.getElementById('positionList');
            
            if (gameState.positions.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无持仓</div>';
                return;
            }

            let html = '';
            gameState.positions.forEach(pos => {
                const currentPrice = gameState.marketData[pos.commodity].currentPrice;
                
                const priceDiff = pos.type === 'long' 
                    ? BigMath.subtract(currentPrice, pos.entryPrice)
                    : BigMath.subtract(pos.entryPrice, currentPrice);
                
                const profitLoss = BigMath.multiply(
                    BigMath.multiply(
                        BigMath.multiply(priceDiff, BigMath.create(pos.quantity.toString())),
                        BigMath.create('100')
                    ),
                    BigMath.create(pos.leverage.toString())
                );

                const typeName = pos.type === 'long' ? '多头' : '空头';
                const typeClass = pos.type === 'long' ? 'long' : 'short';
                const plClass = BigMath.isGreaterThan(profitLoss, BigMath.create('0')) || BigMath.isEqualTo(profitLoss, BigMath.create('0')) ? 'profit' : 'loss';
                const plSymbol = BigMath.isGreaterThan(profitLoss, BigMath.create('0')) || BigMath.isEqualTo(profitLoss, BigMath.create('0')) ? '+' : '';

                html += `
                    <div class="position-item ${typeClass}">
                        <div class="position-header">
                            <span class="position-type">${typeName} ${pos.quantity}手</span>
                            <span class="position-pl ${plClass}">${plSymbol}¥${BigMath.toDisplay(profitLoss, 2)}</span>
                        </div>
                        <div class="position-detail">品种: ${CONFIG.commodities[pos.commodity].name}</div>
                        <div class="position-detail">入场: ¥${BigMath.toDisplay(pos.entryPrice, 2)} | 杠杆: ${pos.leverage}x</div>
                        <div class="position-detail">时间: ${pos.openTime}</div>
                        <button class="close-btn" onclick="game.closePosition(${pos.id})">平仓</button>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        let currentKlinePeriod = '1s';

        function drawCharts() {
            drawKlineChart();
            if (gameState.chartSettings.showVolume) {
                drawVolumeChart();
            }
            if (gameState.chartSettings.showMACD) {
                drawMACDChart();
            }
        }

        function drawKlineChart() {
            const canvas = document.getElementById('klineChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const commodity = gameState.currentCommodity;
            const klines = gameState.klineData[commodity][currentKlinePeriod];

            if (klines.length === 0) {
                ctx.fillStyle = '#555';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无K线数据', canvas.width / 2, canvas.height / 2);
                return;
            }

            const displayCount = Math.min(50, klines.length);
            const startIndex = Math.max(0, klines.length - displayCount);
            const displayKlines = klines.slice(startIndex);

            let maxPrice = displayKlines[0].high;
            let minPrice = displayKlines[0].low;
            displayKlines.forEach(k => {
                maxPrice = BigMath.max(maxPrice, k.high);
                minPrice = BigMath.min(minPrice, k.low);
            });

            const padding = 50;
            const chartWidth = canvas.width - padding * 2;
            const chartHeight = canvas.height - padding * 2;
            const priceRange = BigMath.subtract(maxPrice, minPrice);
            const priceRangeNum = BigMath.isEqualTo(priceRange, BigMath.create('0')) 
                ? 1 
                : BigMath.toNumber(priceRange);

            function priceToY(price) {
                const priceBig = BigMath.create(price);
                const normalized = BigMath.divide(
                    BigMath.subtract(priceBig, minPrice),
                    BigMath.create(priceRangeNum.toString())
                );
                return canvas.height - padding - (BigMath.toNumber(normalized) * chartHeight);
            }

            function indexToX(index) {
                const klineWidth = chartWidth / displayCount;
                return padding + (index + 0.5) * klineWidth;
            }

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding + (i / 4) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();

                const priceAtY = BigMath.add(
                    minPrice,
                    BigMath.multiply(
                        BigMath.create(priceRangeNum.toString()),
                        BigMath.create(((4 - i) / 4).toString())
                    )
                );
                ctx.fillStyle = '#666';
                ctx.font = '11px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(BigMath.toDisplay(priceAtY, 2), padding - 10, y + 4);
            }

            if (gameState.chartSettings.showBoll) {
                const boll = calculateBollinger(displayKlines, 20, 2);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                for (let i = 0; i < boll.upper.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(boll.upper[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                for (let i = boll.lower.length - 1; i >= 0; i--) {
                    const x = indexToX(i);
                    const y = priceToY(boll.lower[i]);
                    ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                
                ctx.beginPath();
                for (let i = 0; i < boll.upper.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(boll.upper[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.beginPath();
                for (let i = 0; i < boll.lower.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(boll.lower[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.setLineDash([]);
            }

            if (gameState.chartSettings.showMA) {
                const ma5 = calculateMA(displayKlines, 5);
                const ma10 = calculateMA(displayKlines, 10);
                const ma20 = calculateMA(displayKlines, 20);

                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < ma5.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(ma5[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.strokeStyle = '#2196f3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < ma10.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(ma10[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.strokeStyle = '#4caf50';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < ma20.length; i++) {
                    const x = indexToX(i);
                    const y = priceToY(ma20[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const klineWidth = chartWidth / displayCount * 0.8;
            displayKlines.forEach((k, i) => {
                const x = indexToX(i);
                const openY = priceToY(k.open);
                const closeY = priceToY(k.close);
                const highY = priceToY(k.high);
                const lowY = priceToY(k.low);

                const isUp = BigMath.isGreaterThan(k.close, k.open) || BigMath.isEqualTo(k.close, k.open);
                ctx.fillStyle = isUp ? '#00ff41' : '#ff3333';
                ctx.strokeStyle = isUp ? '#00ff41' : '#ff3333';

                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, highY);
                ctx.lineTo(x, lowY);
                ctx.stroke();

                const top = Math.min(openY, closeY);
                const height = Math.abs(closeY - openY);
                ctx.fillRect(x - klineWidth / 2, top, klineWidth, Math.max(height, 1));
            });

            ctx.fillStyle = '#666';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            for (let i = 0; i < displayKlines.length; i += Math.ceil(displayKlines.length / 5)) {
                const x = indexToX(i);
                const time = new Date(displayKlines[i].time);
                ctx.fillText(time.getHours() + ':' + String(time.getMinutes()).padStart(2, '0'), x, canvas.height - 15);
            }
        }

        function drawVolumeChart() {
            const canvas = document.getElementById('volumeChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const commodity = gameState.currentCommodity;
            const klines = gameState.klineData[commodity][currentKlinePeriod];

            if (klines.length === 0) return;

            const displayCount = Math.min(50, klines.length);
            const startIndex = Math.max(0, klines.length - displayCount);
            const displayKlines = klines.slice(startIndex);

            let maxVolume = Math.max(...displayKlines.map(k => k.volume));
            if (maxVolume === 0) maxVolume = 1;

            const padding = 50;
            const chartWidth = canvas.width - padding * 2;
            const chartHeight = canvas.height - 30;

            function volumeToY(volume) {
                return canvas.height - 30 - (volume / maxVolume) * chartHeight;
            }

            function indexToX(index) {
                const barWidth = chartWidth / displayCount;
                return padding + (index + 0.5) * barWidth;
            }

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 2; i++) {
                const y = 10 + (i / 2) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();
            }

            const barWidth = chartWidth / displayCount * 0.8;
            displayKlines.forEach((k, i) => {
                const x = indexToX(i);
                const y = volumeToY(k.volume);
                const height = canvas.height - 30 - y;

                const isUp = BigMath.isGreaterThan(k.close, k.open) || BigMath.isEqualTo(k.close, k.open);
                ctx.fillStyle = isUp ? 'rgba(0, 255, 65, 0.6)' : 'rgba(255, 51, 51, 0.6)';
                ctx.fillRect(x - barWidth / 2, y, barWidth, height);
            });

            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('成交量', canvas.width - 10, 15);
        }

        function drawMACDChart() {
            const canvas = document.getElementById('macdChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            const commodity = gameState.currentCommodity;
            const klines = gameState.klineData[commodity][currentKlinePeriod];

            if (klines.length < 26) {
                ctx.fillStyle = '#555';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('数据不足', canvas.width / 2, canvas.height / 2);
                return;
            }

            const displayCount = Math.min(50, klines.length);
            const startIndex = Math.max(0, klines.length - displayCount);
            const displayKlines = klines.slice(startIndex);

            const macd = calculateMACD(displayKlines);

            let maxVal = BigMath.max(...macd.macd, ...macd.signal);
            let minVal = BigMath.min(...macd.macd, ...macd.signal);
            const range = BigMath.abs(BigMath.subtract(maxVal, minVal));
            const rangeNum = BigMath.isEqualTo(range, BigMath.create('0')) ? 1 : BigMath.toNumber(range);
            const midVal = BigMath.divide(BigMath.add(maxVal, minVal), BigMath.create('2'));

            const padding = 50;
            const chartWidth = canvas.width - padding * 2;
            const chartHeight = canvas.height - 30;

            function valueToY(value) {
                const valueBig = BigMath.create(value);
                const normalized = BigMath.divide(
                    BigMath.subtract(valueBig, minVal),
                    BigMath.create(rangeNum.toString())
                );
                return canvas.height - 30 - (BigMath.toNumber(normalized) * chartHeight);
            }

            function indexToX(index) {
                const barWidth = chartWidth / displayCount;
                return padding + (index + 0.5) * barWidth;
            }

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const midY = valueToY(midVal);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(padding, midY);
            ctx.lineTo(canvas.width - padding, midY);
            ctx.stroke();
            ctx.setLineDash([]);

            const barWidth = chartWidth / displayCount * 0.6;
            macd.histogram.forEach((h, i) => {
                if (h !== undefined) {
                    const x = indexToX(i);
                    const y = valueToY(h);
                    const height = midY - y;

                    const isPositive = BigMath.isGreaterThan(h, BigMath.create('0')) || BigMath.isEqualTo(h, BigMath.create('0'));
                    ctx.fillStyle = isPositive ? 'rgba(0, 255, 65, 0.4)' : 'rgba(255, 51, 51, 0.4)';
                    ctx.fillRect(x - barWidth / 2, Math.min(y, midY), barWidth, Math.abs(height));
                }
            });

            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < macd.macd.length; i++) {
                const x = indexToX(i);
                const y = valueToY(macd.macd[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < macd.signal.length; i++) {
                const x = indexToX(i);
                const y = valueToY(macd.signal[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('MACD', canvas.width - 10, 15);
        }

        // ==================== 事件处理 ====================
        function setupEventListeners() {
            document.querySelectorAll('.commodity-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.commodity-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameState.currentCommodity = this.dataset.commodity;
                    const commodityConfig = CONFIG.commodities[gameState.currentCommodity];
                    document.getElementById('commodityName').textContent = 
                        `${commodityConfig.name} (${commodityConfig.symbol})`;
                    updateUI();
                });
            });

            document.querySelectorAll('.kline-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.kline-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentKlinePeriod = this.dataset.period;
                    updateUI();
                });
            });

            document.querySelectorAll('.leverage-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.leverage-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameState.currentLeverage = parseInt(this.dataset.leverage);
                });
            });

            document.getElementById('showMA').addEventListener('change', function() {
                gameState.chartSettings.showMA = this.checked;
                updateUI();
            });

            document.getElementById('showBoll').addEventListener('change', function() {
                gameState.chartSettings.showBoll = this.checked;
                updateUI();
            });

            document.getElementById('showVolume').addEventListener('change', function() {
                gameState.chartSettings.showVolume = this.checked;
                updateUI();
            });

            document.getElementById('showMACD').addEventListener('change', function() {
                gameState.chartSettings.showMACD = this.checked;
                updateUI();
            });

            document.getElementById('fullBtn').addEventListener('click', () => {
                const commodity = gameState.currentCommodity;
                const marginPerUnit = BigMath.divide(
                    calculateMarginRequired(commodity, 1),
                    BigMath.create(gameState.currentLeverage.toString())
                );
                const maxQuantity = BigMath.toNumber(BigMath.divide(gameState.balance, marginPerUnit));
                gameState.currentQuantity = Math.max(1, Math.floor(maxQuantity));
                document.getElementById('quantityInput').value = gameState.currentQuantity;
            });

            document.getElementById('halfBtn').addEventListener('click', () => {
                const commodity = gameState.currentCommodity;
                const marginPerUnit = BigMath.divide(
                    calculateMarginRequired(commodity, 1),
                    BigMath.create(gameState.currentLeverage.toString())
                );
                const maxQuantity = BigMath.toNumber(BigMath.divide(
                    BigMath.divide(gameState.balance, marginPerUnit),
                    BigMath.create('2')
                ));
                gameState.currentQuantity = Math.max(1, Math.floor(maxQuantity));
                document.getElementById('quantityInput').value = gameState.currentQuantity;
            });

            document.getElementById('clearQtyBtn').addEventListener('click', () => {
                gameState.currentQuantity = 1;
                document.getElementById('quantityInput').value = 1;
            });

            document.getElementById('quantityInput').addEventListener('change', function() {
                gameState.currentQuantity = parseInt(this.value) || 1;
            });

            document.getElementById('buyBtn').addEventListener('click', () => {
                openPosition('long');
            });

            document.getElementById('sellBtn').addEventListener('click', () => {
                openPosition('short');
            });

            document.getElementById('modalBtn').addEventListener('click', () => {
                document.getElementById('modal').classList.remove('show');
            });
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').classList.add('show');
        }

        const game = {
            closePosition: closePosition
        };

        function init() {
            setupEventListeners();
            updateUI();

            setInterval(() => {
                updatePrices();
                checkLiquidation();
            }, BigMath.toNumber(BigMath.multiply(CONFIG.tickSize, BigMath.create('1000'))));

            setInterval(checkLiquidation, 1000);

            console.log('游戏已初始化 - 高精度模式（150位小数）');
            console.log('初始资金:', BigMath.toString(CONFIG.initialBalance));
            console.log('保证金比例:', BigMath.toString(BigMath.multiply(CONFIG.marginRatio, BigMath.create('100'))) + '%');
            console.log('爆仓阈值:', BigMath.toString(BigMath.multiply(CONFIG.liquidationThreshold, BigMath.create('100'))) + '%');
        }

        window.addEventListener('load', init);
    </script>
